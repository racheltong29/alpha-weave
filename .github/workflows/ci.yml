name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Includes the frozen-benchmark regression gate: a failure here means a
      # change to the backtest engine or signal computation silently shifted
      # results, most often via reintroduced lookahead bias.
      - name: Run tests
        run: pytest -q
